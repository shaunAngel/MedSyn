<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="terracottaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B263E" />
      <stop offset="100%" stop-color="#6B1D2F" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100" height="100" rx="24" fill="url(#terracottaGrad)" />
  <!-- DNA Helix Emblem -->
  <path d="M 30 25 C 45 40, 55 60, 70 75 M 70 25 C 55 40, 45 60, 30 75" stroke="#FDF8F2" stroke-width="6" stroke-linecap="round" fill="none" filter="url(#glow)"/>
  <circle cx="30" cy="25" r="5" fill="#E89B72"/>
  <circle cx="70" cy="25" r="5" fill="#E89B72"/>
  <circle cx="50" cy="50" r="6" fill="#FDF8F2"/>
  <circle cx="30" cy="75" r="5" fill="#E89B72"/>
  <circle cx="70" cy="75" r="5" fill="#E89B72"/>
</svg>